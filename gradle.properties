org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true

# Mod metadata
mod_id=perfectgraves
mod_name=Perfect Graves
mod_version=1.0.2
mod_group_id=com.risen.perfectgraves
mod_authors=risenxxx
mod_description=Gravestones that respect your claims, your inventory mods, and your server's TPS.
mod_license=MIT

# Minecraft + Forge pins
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)

# Mappings
mapping_channel=parchment
mapping_version=2023.09.03-1.20.1

# Soft-dep version pins. Bump these explicitly when updating.
ftbchunks_version=2001.3.7
ftblibrary_version=2001.2.9
ftbteams_version=2001.3.1
opac_version=forge-1.20.1-0.26.1
flan_version=1.20.1-1.11.15-forge
curios_version=5.9.1+1.20.1

# Publishing — used by the build-and-publish.yml CI workflow's release step.
# `modrinth_project_id` is the slug or numeric ID from the Modrinth project URL.
# `curseforge_project_id` is the numeric Project ID from the CurseForge project page.
# Real auth tokens never live in this file — they're set as repo secrets in GitHub Actions.
modrinth_project_id=perfect-graves
curseforge_project_id=1530944
