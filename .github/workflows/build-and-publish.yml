name: Build and Release

# What this workflow does:
#  1. Always builds the mod jar on every push / PR to main, uploads it as an artifact.
#  2. On a push to main where `mod_version` in gradle.properties is NEW (no `vX.Y.Z` tag yet),
#     creates a GitHub Release tagged `vX.Y.Z` with the jar attached.
#  3. On the same condition, publishes to Modrinth and CurseForge — but only if the
#     respective tokens are configured as repo secrets. Each step no-ops if its token is
#     missing, so contributors without the secrets won't see failed runs.
#  4. Runs grep-based regression checks on critical invariants (event priorities, no
#     force-chunk-load, optional-mod imports outside integrations/) — fast guard against
#     accidental regressions.
#
# Required repo secrets (Settings → Secrets and variables → Actions → New repository secret):
#  - MODRINTH_TOKEN     — pat from https://modrinth.com/settings/pats (scope: write_versions)
#  - CURSEFORGE_TOKEN   — api token from https://legacy.curseforge.com/account/api-tokens
#
# Required gradle.properties keys for publishing:
#  - modrinth_project_id   — slug or ID, e.g. "perfect-graves"
#  - curseforge_project_id — numeric project ID from the CurseForge project page

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.8"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `git rev-parse v$VERSION` can see existing tags.
          fetch-depth: 0

      - name: Read mod_version from gradle.properties
        id: version
        run: |
          VERSION=$(grep -m1 '^mod_version' gradle.properties \
                      | sed -E 's/mod_version[[:space:]]*=[[:space:]]*//' \
                      | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected mod_version: $VERSION"

          # Only main pushes are candidates for release. PRs and manual runs just build.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            if git rev-parse "v$VERSION" >/dev/null 2>&1; then
              echo "Tag v$VERSION already exists — skipping release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Tag v$VERSION is new — will release."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          # Only write to the cache from main so PR runs can't pollute it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate resource templating (mods.toml, pack.mcmeta)
        run: gradle processResources --no-daemon --stacktrace

      - name: Compile
        run: gradle compileJava --no-daemon --stacktrace

      - name: Run tests
        run: gradle test --no-daemon --stacktrace

      - name: Build jar
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: perfectgraves-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create GitHub release
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: v${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mod jar artifact
        uses: actions/download-artifact@v8
        with:
          name: perfectgraves-jar
          path: build/libs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Perfect Graves v${{ needs.build.outputs.version }}
          generate_release_notes: true
          body: |
            ### Downloads
            | File | Description |
            |------|-------------|
            | `perfectgraves-${{ needs.build.outputs.version }}.jar` | Forge 1.20.1 mod jar |

            See the [README](https://github.com/${{ github.repository }}#perfect-graves) for configuration details.
          files: build/libs/*.jar

  publish:
    name: Publish to Modrinth and CurseForge
    needs: [build, release]
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build for publish
        run: gradle build --no-daemon --stacktrace

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: gradle modrinth --no-daemon --stacktrace

      - name: Publish to CurseForge
        if: env.CURSEFORGE_TOKEN != ''
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: gradle publishCurseForge --no-daemon --stacktrace

  verify-plan-invariants:
    name: Verify plan invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Guards the non-negotiables documented in CLAUDE.md (Critical Invariants section).
      # Fast grep-based checks that catch the most common regressions without requiring
      # a full build to succeed.
      - name: LivingDropsEvent handler declares LOWEST + receiveCanceled=false (positive)
        run: |
          files=$(grep -l -r --include="*.java" "LivingDropsEvent event)" src/main/java 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "No LivingDropsEvent handlers yet; skipping."
            exit 0
          fi
          failed=0
          for f in $files; do
            if ! grep -q "EventPriority\.LOWEST" "$f"; then
              echo "::error file=$f::LivingDropsEvent handler file missing EventPriority.LOWEST"
              failed=1
            fi
            if ! grep -Eq "receiveCanceled\s*=\s*false" "$f"; then
              echo "::error file=$f::LivingDropsEvent handler file missing receiveCanceled = false"
              failed=1
            fi
          done
          exit $failed

      - name: LivingDropsEvent annotation line is LOWEST (negative)
        run: |
          # -B 1 binds the priority check to the annotation directly above the method
          # signature. The regex word boundary \b prevents EventPriority.LOW from also
          # matching EventPriority.LOWEST.
          if grep -rn -B 1 --include="*.java" "LivingDropsEvent event)" src/main/java 2>/dev/null \
             | grep -E "priority\s*=\s*EventPriority\.(HIGHEST|HIGH|NORMAL|LOW)\b"; then
            echo "::error::LivingDropsEvent handler annotation uses a non-LOWEST priority. CLAUDE.md Critical Invariants require LOWEST."
            exit 1
          fi

      - name: LivingDropsEvent annotation does not set receiveCanceled=true (negative)
        run: |
          if grep -rn -B 1 --include="*.java" "LivingDropsEvent event)" src/main/java 2>/dev/null \
             | grep -Eq "receiveCanceled\s*=\s*true"; then
            echo "::error::LivingDropsEvent handler sets receiveCanceled=true. CLAUDE.md Critical Invariants require false."
            exit 1
          fi

      - name: No direct imports of optional mods outside integrations/
        run: |
          violations=$(grep -rn "^import \(top\.theillusivec4\.curios\|dev\.ftb\.mods\.ftbchunks\|xaero\.pac\|io\.github\.flemmli97\.flan\)" \
            src/main/java 2>/dev/null | grep -v "/integrations/" || true)
          if [ -n "$violations" ]; then
            echo "::error::Optional-mod classes imported outside integrations/. CLAUDE.md Critical Invariants forbid this."
            echo "$violations"
            exit 1
          fi

      - name: No force chunk-loading in shell search
        run: |
          if grep -rn "getChunk([^,)]*,[^,)]*, true" src/main/java/com/risen/perfectgraves/placement 2>/dev/null; then
            echo "::error::Shell search must not force-load chunks. Use level.hasChunk(cx, cz) and skip."
            exit 1
          fi

      - name: No ForgeChunkManager.forceChunk in shell search
        run: |
          if grep -rn "ForgeChunkManager\.forceChunk\|ForgeChunkManager\.force" src/main/java/com/risen/perfectgraves/placement 2>/dev/null; then
            echo "::error::Shell search must not force-load chunks via ForgeChunkManager."
            exit 1
          fi
